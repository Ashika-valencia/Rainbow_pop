<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7d7e8">
  <title>Rainbow Pop</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body class="start-screen">
  <main class="simple-home">
    <div class="soft-glow glow-one"></div>
    <div class="soft-glow glow-two"></div>
    <div class="mini-sparkles">✦　˚　♡　✧　˚　✦</div>

    <section class="welcome-card">
      <div class="mini-rainbow">🌈</div>
      <div class="eyebrow">A LITTLE COLOR, A LOT OF FUN</div>
      <h1 class="simple-title">Rainbow Pop</h1>
      <p class="simple-subtitle">Pop the right colors.<br>Build your streak. ✨</p>

      <div class="simple-preview">
        <span class="preview-balloon pb-pink">♡</span>
        <span class="preview-balloon pb-lav">✦</span>
        <span class="preview-balloon pb-mint">♡</span>
        <span class="preview-balloon pb-yellow">✦</span>
      </div>

      <button class="play-button" onclick="startGame()">✦ Play Now</button>
      <button class="how-button" onclick="showHowToPlay()">How to play</button>
      <p id="homeInfo" class="home-info"></p>
    </section>

    <div class="tiny-note">♡ 3 lives　•　✦ combos　•　⚡ power-ups</div>
  </main>

  <script>
    function startGame() {
      window.location.href = 'game.html';
    }

    function showHowToPlay() {
      document.getElementById('homeInfo').textContent =
        'Pop only the target color • wrong pops cost a life • keep your streak alive ✨';
    }
  </script>
</body>
</html>
