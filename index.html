<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rainbow Pop</title><link rel="stylesheet" href="./style.css?v=10"></head><body class="start-screen"><main class="simple-home"><div class="soft-glow glow-one"></div><div class="soft-glow glow-two"></div><div class="mini-sparkles">✦　˚　♡　✧　˚　✦</div><section class="welcome-card"><div class="mini-rainbow">🌈</div><div class="eyebrow">A LITTLE COLOR, A LOT OF FUN</div><h1 class="simple-title">Rainbow Pop</h1><p class="simple-subtitle">Pop the right colors.<br>Build your streak. ✨</p><div class="simple-preview"><span class="preview-balloon pb-pink">♡</span><span class="preview-balloon pb-lav">✦</span><span class="preview-balloon pb-mint">♡</span><span class="preview-balloon pb-yellow">✦</span></div><button type="button" id="playButton" class="play-button">✦ Play Now</button><button type="button" id="howButton" class="how-button">How to play</button></section><div class="tiny-note">♡ 3 lives　•　✦ combos　•　⚡ power-ups</div></main><div id="howOverlay" class="how-overlay" aria-hidden="true"><div class="how-card"><div class="how-icon">🌈</div><h2>How to play</h2><p>🎯 Look at the target color.<br>🎈 Pop only matching balloons.<br>❤️ You have 3 lives.<br>🔥 Build your combo.<br>⚡ Use power-ups!</p><button type="button" id="closeHow" class="close-how">Got it ♡</button></div></div><script>const playButton=document.getElementById('playButton');const howButton=document.getElementById('howButton');const closeHow=document.getElementById('closeHow');const howOverlay=document.getElementById('howOverlay');playButton.onclick=function(){location.href='game.html';};howButton.onclick=function(){howOverlay.classList.add('show');};closeHow.onclick=function(){howOverlay.classList.remove('show');};howOverlay.onclick=function(e){if(e.target===howOverlay)howOverlay.classList.remove('show');};</script></body></html>
