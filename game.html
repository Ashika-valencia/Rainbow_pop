<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play - Color Pop Challenge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="game-screen">
  <div class="top-bar">
    <div id="timerContainer">
  <div id="timerBar"></div>
</div>

    <div id="viewBadgesBtn" onclick="viewBadges()">🏅 View Badges</div>
  </div>

  <h2 id="targetColor">Get Ready...</h2>
  <div id="balloonContainer"></div>

  <div id="scoreBoard">
    <p>Score: <span id="score">0</span></p>
    <button id="exitBtn" onclick="exitGame()">Exit Game</button>
  </div>

  <div id="loadingScreen" class="loading">🎈 Loading balloons 🎈</div>

  <script src="script.js"></script>
</body>
</html>
